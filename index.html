<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#192b38"><title>POCKTIVO · Projektverwaltung</title><style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#1b2931;background:#f5f6f5;font-size:15px}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.45}header{background:#192b38;color:white;padding:18px 18px 14px;position:sticky;top:0;z-index:10}header .wrap{max-width:960px;margin:auto;display:flex;gap:12px;align-items:center;justify-content:space-between}.brand{display:flex;gap:10px;align-items:center;font-weight:900;letter-spacing:.07em;font-size:19px}.logo{height:35px;width:35px;border:2px solid #e6e9e8;border-radius:10px;display:grid;place-items:center;font-weight:900;font-size:24px;position:relative}.logo:after{content:'';position:absolute;left:6px;bottom:3px;width:9px;height:4px;background:#cf8445;transform:skew(-20deg)}.subbrand{font-size:11px;font-weight:400;color:#b4c0c4;letter-spacing:0}.toplink{border:1px solid #617078;border-radius:9px;color:white;background:transparent;padding:8px 10px}.page{max-width:960px;margin:auto;padding:22px 16px 100px}.muted{color:#68777e}.tiny{font-size:12px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:#68777e;font-weight:700}.h1{font-weight:850;font-size:27px;margin:5px 0 6px;letter-spacing:-.035em}.h2{font-size:18px;margin:0}.panel{background:#fff;border:1px solid #e0e5e5;border-radius:15px;padding:18px;margin:14px 0;box-shadow:0 3px 10px #22303908}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 14px}.btn{border:0;border-radius:11px;background:#1e3341;color:white;min-height:44px;padding:11px 16px;font-weight:700}.btn.light{background:#edf1f1;color:#273942}.btn.outline{border:1px solid #cdd7d9;background:white;color:#263b45}.btn.danger{background:#fff3f0;color:#953f33}.btn.sm{min-height:36px;padding:7px 12px;font-size:13px}.btn.full{width:100%}.btnrow{display:flex;gap:9px;flex-wrap:wrap}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}.field label{font-size:13px;font-weight:700;color:#334953}.field input,.field select,.field textarea{width:100%;border:1px solid #cbd5d8;border-radius:10px;background:white;color:#172a34;padding:12px;min-height:44px;outline-color:#ab7b56}.field textarea{min-height:92px;resize:vertical}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}.formgrid .wide{grid-column:1/-1}.proj{width:100%;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid #dce3e5;background:white;border-radius:13px;padding:16px;margin:9px 0}.proj strong{display:block;font-size:16px;margin-bottom:4px}.arrow{font-size:23px;color:#677984}.pill{display:inline-block;background:#edf0ed;color:#465861;border-radius:30px;padding:5px 9px;font-size:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{border:1px solid #e1e6e7;border-radius:12px;background:#fff;padding:13px}.stat b{font-size:23px;display:block}.stat span{font-size:12px;color:#68777e}.steps{display:flex;gap:5px;flex-wrap:wrap;margin:12px 0 17px}.step{background:#e9edee;color:#5f737b;border-radius:20px;font-size:12px;padding:7px 10px}.step.active{background:#263c49;color:#fff}.room{border:1px solid #dce4e5;border-radius:13px;padding:14px;margin:9px 0;display:flex;align-items:center;gap:12px;justify-content:space-between}.roomname{font-weight:800}.note{background:#f0f2ed;border-left:3px solid #ba8859;padding:12px;font-size:13px;color:#4b5d62;border-radius:6px;margin:12px 0}.space{height:8px}.empty{text-align:center;color:#66777d;padding:36px 12px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.tag{font-size:11px;color:#85633f;background:#fbf1e6;padding:4px 8px;border-radius:20px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.service{display:flex;align-items:start;gap:10px;border-bottom:1px solid #edf0f0;padding:10px 0}.service input{width:19px;height:19px;accent-color:#2c564c}.service .description{font-size:12px;color:#677980}.accordion{border:1px solid #dfe7e8;border-radius:11px;overflow:hidden;margin:8px 0}.accordion summary{padding:13px 14px;font-weight:750;cursor:pointer;background:#f8fafa}.accordion .inside{padding:12px}.search{width:100%;min-height:44px;border:1px solid #cbd5d8;border-radius:10px;padding:12px}.banner{background:#eef2ef;border-radius:11px;padding:12px;font-size:13px;color:#445c59}.smallgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.dangertext{color:#9d5042}.line{border:0;border-top:1px solid #e4e9e9;margin:18px 0}.loading{font-size:12px;color:#536a73}@media(max-width:580px){.page{padding:19px 13px 95px}.formgrid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.stat{padding:10px}.stat b{font-size:20px}.panel{padding:15px}.h1{font-size:25px}}
</style></head><body><header><div class="wrap"><div class="brand"><span class="logo">P</span><span>POCKTIVO<div class="subbrand">Dein Büro. Immer dabei.</div></span></div><button class="toplink" id="homeBtn">⌂ Startseite</button></div></header><main class="page" id="app"></main><script>
'use strict';const STORE='pocktivo-projects-v40';const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>globalThis.crypto?.randomUUID?.()||('id'+Date.now()+Math.random().toString(36).slice(2));let projects=[];try{projects=JSON.parse(localStorage.getItem(STORE)||'[]');if(!Array.isArray(projects))projects=[]}catch(e){projects=[]}let page='home',currentId=null,currentRoom=null,serviceData=[],ruleData=[];let loadErrors=[];
function save(){try{localStorage.setItem(STORE,JSON.stringify(projects));return true}catch(e){alert('Speichern nicht möglich (Speicher voll oder privater Browser). Bitte Daten exportieren.');return false}}function getProject(){return projects.find(x=>x.id===currentId)}function getRoom(){return getProject()?.rooms.find(x=>x.id===currentRoom)}function nav(p,id=null,rid=null){page=p;if(id!==null)currentId=id;if(rid!==null)currentRoom=rid;render();window.scrollTo(0,0)}function record(t){return `<div class="field"><label>${t[1]}</label><input name="${t[0]}" value="${esc(t[2]||'')}" ${t[3]||''}></div>`}function headline(label,title,description=''){return `<div class="eyebrow">${label}</div><div class="h1">${title}</div>${description?`<p class="muted">${description}</p>`:''}`};
function render(){const app=$('#app');if(page==='home')app.innerHTML=homeView();if(page==='create')app.innerHTML=projectForm();if(page==='project')app.innerHTML=projectView();if(page==='room')app.innerHTML=roomView();if(page==='services')app.innerHTML=servicesView();bind();}
function homeView(){return headline('Meine Arbeitszentrale','Projekte','Alle Daten dieser Demo bleiben ausschließlich in diesem Browser gespeichert.')+`<div class="stats"><div class="stat"><b>${projects.length}</b><span>Projekte</span></div><div class="stat"><b>${projects.reduce((a,p)=>a+p.rooms.length,0)}</b><span>Räume</span></div><div class="stat"><b>${projects.filter(p=>p.status==='offen').length}</b><span>Offen</span></div></div><div class="panel"><div class="sectionhead"><h2 class="h2">Projektübersicht</h2><button class="btn" data-act="create">+ Neues Projekt</button></div>${projects.length?projects.map(p=>`<button class="proj" data-act="open" data-id="${p.id}"><span><strong>${esc(p.title||'Unbenanntes Projekt')}</strong><span class="muted tiny">${esc(p.customer.name||p.customer.company||'Kunde nicht angegeben')} · ${p.rooms.length} Räume · ${esc(p.status||'offen')}</span></span><span class="arrow">›</span></button>`).join(''):`<div class="empty">Noch keine Projekte angelegt.<br>Starte mit deinem ersten Testprojekt.</div>`}</div><div class="note">Nur fiktive Kundendaten verwenden. Diese Version hat noch keinen Login, keine Synchronisierung und keine Cloud-Sicherung.</div><div class="btnrow"><button class="btn light sm" data-act="export">Projekte sichern (JSON)</button><button class="btn light sm" data-act="import">Sicherung importieren</button><input type="file" id="importfile" accept="application/json,.json" hidden></div>`}
function projectForm(){return headline('Projektanlage · Schritt 1','Neues Projekt','Kundendaten werden einmal erfasst und für alle Räume dieses Projekts übernommen.')+`<form id="newProject" class="panel"><h2 class="h2">Projekt</h2><div class="space"></div>${record(['title','Projektbezeichnung','', 'required placeholder="z. B. Badrenovierung Musterstraße"'])}<div class="formgrid"><div class="field"><label>Kundentyp</label><select name="type"><option value="privat">Privat</option><option value="gewerbe">Gewerbe</option></select></div><div class="field"><label>Anrede</label><select name="salutation"><option value="">Ohne Angabe</option><option>Herr</option><option>Frau</option><option>Divers</option></select></div>${record(['name','Vor- und Nachname'])}${record(['company','Firmenname (optional)'])}${record(['email','E-Mail','', 'type="email"'])}${record(['phone','Telefon','', 'type="tel"'])}<div class="wide"><h2 class="h2">Rechnungsadresse</h2></div>${record(['street','Straße'])}${record(['houseNo','Hausnummer'])}${record(['zip','Postleitzahl'])}${record(['city','Ort'])}<div class="wide"><label><input type="checkbox" name="differentSite" id="differentSite"> Baustellenadresse weicht ab</label></div><div class="wide" id="siteFields" hidden><div class="formgrid">${record(['siteStreet','Baustelle: Straße'])}${record(['siteHouseNo','Baustelle: Hausnummer'])}${record(['siteZip','Baustelle: PLZ'])}${record(['siteCity','Baustelle: Ort'])}</div></div><div class="wide"><div class="field"><label>Kurzbeschreibung (optional)</label><textarea name="notes" placeholder="Worum geht es bei diesem Projekt?"></textarea></div></div></div><div class="btnrow"><button type="submit" class="btn">Projekt anlegen und weiter →</button><button type="button" class="btn outline" data-act="home">Abbrechen</button></div></form>`}
function projectView(){const p=getProject();if(!p)return homeView();return headline('Projektübersicht',esc(p.title),esc(p.customer.name||p.customer.company||'Ohne Kundenname'))+`<div class="steps"><span class="step active">✓ Stammdaten</span><span class="step ${p.rooms.length?'active':''}">2. Räume</span><span class="step">3. Aufnahme</span></div><div class="panel"><div class="sectionhead"><h2 class="h2">Stammdaten</h2><span class="pill">${esc(p.status)}</span></div><p class="muted">${esc(p.customer.street)} ${esc(p.customer.houseNo)}, ${esc(p.customer.zip)} ${esc(p.customer.city)}</p><div class="btnrow"><button class="btn light sm" data-act="editproject">Bearbeiten</button><button class="btn light sm" data-act="status">${p.status==='offen'?'Als abgeschlossen markieren':'Wieder öffnen'}</button></div></div><div class="panel"><div class="sectionhead"><h2 class="h2">Räume / Bereiche (${p.rooms.length})</h2><button class="btn" data-act="newroom">+ Raum</button></div>${p.rooms.length?p.rooms.map((r,i)=>`<div class="room"><div><div class="roomname">${esc(r.name)}</div><div class="muted tiny">${r.length>0&&r.width>0?(r.length*r.width).toLocaleString('de-DE',{maximumFractionDigits:2})+' m² Boden':'Noch kein Aufmaß'} · ${r.selected.length} Leistungen</div></div><button class="btn light sm" data-act="openroom" data-id="${r.id}">Öffnen ›</button></div>`).join(''):`<div class="empty">Lege deinen ersten Raum an.<br>Alle Räume gehören zu diesem Projekt.</div>`}</div><div class="panel"><div class="sectionhead"><h2 class="h2">Projektübersicht</h2><span class="pill">In Vorbereitung</span></div><p class="muted tiny">${p.rooms.length} Räume · ${p.rooms.reduce((a,r)=>a+r.selected.length,0)} ausgewählte Leistungen</p><div class="btnrow"><button class="btn light sm" data-act="export">Projekt sichern</button><button class="btn danger sm" data-act="deleteproject">Projekt löschen</button></div></div><button class="btn outline" data-act="home">← Alle Projekte</button>`}
function roomView(){const p=getProject(),r=getRoom();if(!r)return projectView();const a=r.length*r.width,u=2*(r.length+r.width),w=u*r.height;return headline('Projekt: '+esc(p.title),'Raum: '+esc(r.name),'Raumdaten und Leistungen sind diesem Projekt zugeordnet.')+`<div class="steps"><span class="step active">1. Aufmaß</span><span class="step">2. Beschreibung</span><span class="step">3. Leistungen</span></div><form id="roomForm" class="panel"><div class="sectionhead"><h2 class="h2">Raumaufnahme</h2><span class="pill">Einfaches Aufmaß</span></div>${record(['roomName','Raumname',r.name,'required'])}<div class="formgrid">${record(['length','Länge (m)',r.length||'', 'type="number" step="0.01" min="0" inputmode="decimal"'])}${record(['width','Breite (m)',r.width||'', 'type="number" step="0.01" min="0" inputmode="decimal"'])}${record(['height','Raumhöhe (m)',r.height||'', 'type="number" step="0.01" min="0" inputmode="decimal"'])}</div><div class="stats"><div class="stat"><b id="floorArea">${fmt(a)}</b><span>Boden m²</span></div><div class="stat"><b id="wallArea">${fmt(w)}</b><span>Wand brutto m²</span></div><div class="stat"><b id="perimeter">${fmt(u)}</b><span>Umfang m</span></div></div><div class="note">Diese erste Version rechnet rechteckige Räume. Freihand-Grundriss, Tür-/Fensterabzüge und nicht rechteckige Räume ergänzen wir im nächsten Schritt.</div><div class="field"><label>Was soll in diesem Raum gemacht werden?</label><textarea name="description" placeholder="Beispiel: Alte Fliesen entfernen, Dusche bodengleich umbauen...">${esc(r.description)}</textarea></div><div class="btnrow"><button type="submit" class="btn">Aufmaß und Beschreibung speichern</button><button type="button" class="btn outline" data-act="services">Leistungen ansehen →</button></div></form><div class="panel"><div class="sectionhead"><h2 class="h2">Weitere Räume</h2><button class="btn light sm" data-act="newroom">+ Hinzufügen</button></div><button class="btn light sm" data-act="project">← Projektübersicht</button> <button class="btn danger sm" data-act="deleteroom">Raum löschen</button></div>`}
function fmt(n){return Number.isFinite(n)?n.toLocaleString('de-DE',{maximumFractionDigits:2}):'–'}
function suggest(r){const s=r.description.toLowerCase();let terms=[];if(/fliese|fliesen|gefliest/.test(s))terms.push('Fliesenarbeiten','Fliesen');if(/estrich|bodengleich|gefälle/.test(s))terms.push('Estrich','Gefälle');if(/dusche|ablauf|waschtisch|wc|sanitär|wasser/.test(s))terms.push('Sanitär','Abdichtung');if(/abdicht|nasszelle|dusche/.test(s))terms.push('Abdichtung');if(/putz|verputz/.test(s))terms.push('Putz');if(/farbe|streichen|maler/.test(s))terms.push('Maler');if(/rückbau|abbruch|entfernen|alte/.test(s))terms.push('Rückbau');return [...new Set(terms)]}
function servicesView(){const p=getProject(),r=getRoom();if(!r)return projectView();const terms=suggest(r);const selection=r.selected||[];const available=serviceData.filter(s=>terms.some(t=>(String(s.Gewerk)+' '+s.Kategorie+' '+s.Leistung).toLowerCase().includes(t.toLowerCase()))).slice(0,140);return headline('Projekt: '+esc(p.title),'Leistungen · '+esc(r.name),'Passende Gewerke auswählen. Ergänzungen sind immer möglich.')+`<div class="panel"><div class="banner">Die vorgeschlagenen Treffer stammen aus dem bestehenden Katalog. Sie sind <b>nicht fachlich freigegeben</b> und werden in dieser Basis-Demo nicht automatisch angehakt.</div><p class="muted tiny">Aus Beschreibung erkannt: ${terms.length?terms.map(esc).join(' · '):'Noch keine eindeutigen Gewerke erkannt – bitte unten suchen.'}</p><div class="sectionhead"><h2 class="h2">Ausgewählt (${selection.length})</h2><button class="btn light sm" data-act="room">← Raum</button></div>${selection.length?selection.map(x=>`<div class="service"><button class="btn danger sm" data-act="removeservice" data-id="${esc(x.id)}">×</button><div><b>${esc(x.name)}</b><div class="description">${esc(x.unit||'')} · ${esc(x.id)}</div></div></div>`).join(''):'<p class="muted">Noch nichts ausgewählt.</p>'}</div><div class="panel"><h2 class="h2">Passende Leistungen</h2>${!serviceData.length?'<div class="note">Die Datei leistungen.json wurde nicht geladen. Prüfe, ob sie auf GitHub im selben Ordner wie index.html liegt.</div>':''}${renderServiceGroups(available,selection)}<hr class="line"><div class="field"><label>Gesamten Katalog durchsuchen</label><input id="serviceSearch" type="search" placeholder="z. B. Duschrinne, Estrich, Putz ..."></div><div id="searchResults" class="tiny muted">Suchbegriff eingeben, um weitere Leistungen zu finden.</div><hr class="line"><div class="field"><label>Eigene Leistung ergänzen</label><input id="customService" placeholder="Leistung frei beschreiben"></div><button class="btn light" data-act="custom">+ Manuell hinzufügen</button></div><button class="btn" data-act="project">Zur Projektübersicht →</button>`}
function renderServiceGroups(items,selected){const grouped={};items.forEach(s=>{let k=s.Gewerk||'Weitere Arbeiten';(grouped[k]??=[]).push(s)});if(!items.length)return '<p class="muted">Keine automatischen Treffer. Nutze die Suche oder füge eine eigene Leistung hinzu.</p>';return Object.entries(grouped).map(([name,ss])=>`<details class="accordion"><summary>${esc(name)} (${ss.length})</summary><div class="inside">${ss.slice(0,35).map(s=>serviceLine(s,selected)).join('')}</div></details>`).join('')}
function serviceLine(s,selection){const id=String(s.ID),found=selection.some(x=>x.id===id);return `<label class="service"><input class="serviceCheck" type="checkbox" data-id="${esc(id)}" ${found?'checked':''}><div><b>${esc(s.Leistung)}</b><div class="description">${esc(s.Kategorie)} · ${esc(s.Einheit)} · ${esc(id)}</div></div></label>`}
function addService(id,checked){const r=getRoom();const s=serviceData.find(x=>x.ID===id);if(!r||!s)return;if(checked&&!r.selected.some(x=>x.id===id))r.selected.push({id,name:s.Leistung,unit:s.Einheit,trade:s.Gewerk});if(!checked)r.selected=r.selected.filter(x=>x.id!==id);save();render()}
function bind(){document.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click',()=>action(b.dataset.act,b.dataset.id)));$('#newProject')?.addEventListener('submit',e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target).entries());let p={id:uid(),title:d.title,customer:d,rooms:[],status:'offen',created:Date.now()};projects.unshift(p);if(save())nav('project',p.id)});$('#differentSite')?.addEventListener('change',e=>$('#siteFields').hidden=!e.target.checked);$('#roomForm')?.addEventListener('submit',e=>{e.preventDefault();updateRoom(e.target);nav('room')});$('#roomForm')?.querySelectorAll('input[type=number]').forEach(el=>el.addEventListener('input',()=>{const f=$('#roomForm');const L=+f.elements.namedItem('length').value||0,W=+f.elements.namedItem('width').value||0,H=+f.elements.namedItem('height').value||0;$('#floorArea').textContent=fmt(L*W);$('#perimeter').textContent=fmt(2*(L+W));$('#wallArea').textContent=fmt(2*(L+W)*H)}));document.querySelectorAll('.serviceCheck').forEach(cb=>cb.addEventListener('change',e=>addService(e.target.dataset.id,e.target.checked)));$('#serviceSearch')?.addEventListener('input',e=>{const t=e.target.value.trim().toLowerCase();const box=$('#searchResults');box.innerHTML=t.length<2?'Mindestens 2 Zeichen eingeben.':serviceData.filter(s=>(s.Gewerk+' '+s.Leistung+' '+s.Kategorie).toLowerCase().includes(t)).slice(0,30).map(s=>serviceLine(s,getRoom().selected)).join('')||'Keine Treffer';box.querySelectorAll('.serviceCheck').forEach(cb=>cb.addEventListener('change',e=>addService(e.target.dataset.id,e.target.checked)))});$('#importfile')?.addEventListener('change',importProjects)}
function updateRoom(f){const r=getRoom(),d=Object.fromEntries(new FormData(f).entries());r.name=d.roomName.trim()||r.name;r.length=+d.length||0;r.width=+d.width||0;r.height=+d.height||0;r.description=d.description||'';save()}
function action(a,id){const p=getProject();if(a==='home')nav('home');if(a==='create')nav('create');if(a==='open')nav('project',id);if(a==='project')nav('project');if(a==='room'){if($('#roomForm'))updateRoom($('#roomForm'));nav('room')}if(a==='newroom'){const name=prompt('Wie heißt der neue Raum?',`Raum ${(p?.rooms.length||0)+1}`);if(!name?.trim())return;const r={id:uid(),name:name.trim(),length:0,width:0,height:0,description:'',selected:[]};p.rooms.push(r);save();nav('room',null,r.id)}if(a==='openroom')nav('room',null,id);if(a==='services'){if($('#roomForm'))updateRoom($('#roomForm'));nav('services')}if(a==='status'){p.status=p.status==='offen'?'abgeschlossen':'offen';save();render()}if(a==='deleteroom'&&confirm('Diesen Raum samt Aufmaß und Leistungen wirklich löschen?')){p.rooms=p.rooms.filter(r=>r.id!==currentRoom);save();nav('project')}if(a==='deleteproject'&&confirm('Projekt einschließlich aller Räume endgültig löschen?')){projects=projects.filter(x=>x.id!==currentId);save();nav('home')}if(a==='removeservice'){getRoom().selected=getRoom().selected.filter(x=>x.id!==id);save();render()}if(a==='custom'){const s=$('#customService')?.value.trim();if(!s)return;getRoom().selected.push({id:'MAN-'+uid(),name:s,unit:'offen',trade:'Manuelle Ergänzung'});save();render()}if(a==='export'){const data=page==='project'&&p?[p]:projects;const blob=new Blob([JSON.stringify({version:4,projects:data},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download='pocktivo_sicherung.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}if(a==='import')$('#importfile')?.click();if(a==='editproject'){const title=prompt('Projektbezeichnung bearbeiten',p.title);if(title?.trim()){p.title=title.trim();save();render()}}}
async function importProjects(e){const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text()),arr=d.projects;if(!Array.isArray(arr)||!arr.every(p=>p.id&&Array.isArray(p.rooms)&&p.customer))throw Error('Ungültige Projektdatei');if(!confirm(`${arr.length} Projekte importieren? Gleichnamige IDs werden ersetzt.`))return;const m=new Map(projects.map(x=>[x.id,x]));arr.forEach(x=>m.set(x.id,x));projects=[...m.values()];save();render()}catch(e){alert('Import fehlgeschlagen: '+e.message)}}
$('#homeBtn').onclick=()=>nav('home');Promise.allSettled([fetch('./leistungen.json').then(r=>{if(!r.ok)throw Error('leistungen.json: '+r.status);return r.json()}),fetch('./ablauf.json').then(r=>{if(!r.ok)throw Error('ablauf.json: '+r.status);return r.json()})]).then(([a,b])=>{if(a.status==='fulfilled')serviceData=a.value;else loadErrors.push(a.reason.message);if(b.status==='fulfilled')ruleData=b.value.rules||[];else loadErrors.push(b.reason.message);if(page==='services')render()});render();
</script></body></html>
