epeat(3,minmax(0,1fr))}.stat{padding:10px}.stat b{font-size:20px}.panel{padding:15px}.h1{font-size:25px}}

.fileitem{display:flex;gap:10px;align-items:center;justify-content:space-between;border:1px solid #e1e6e7;padding:9px;border-radius:10px;margin:8px 0;min-width:0}.fileitem .fname{overflow-wrap:anywhere;max-width:75%}.voicebtn{border:1px solid #aebdbd;border-radius:10px;background:#fff;color:#182f39;padding:10px;min-height:44px;font-weight:750}.voicebtn.rec{background:#faeee9;color:#a13c2c}.drawpad{border:2px solid #cbd5d8;border-radius:12px;background:#f9fbfb;touch-action:none;display:block;width:100%;height:270px}.floorhint{font-size:12px;color:#657780;margin-top:6px}.tabrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.tabrow button[aria-pressed=true]{background:#1e3341;color:white}.savebadge{color:#25604b;font-size:12px}.accordion[open]>summary{background:#ecf1ed}.service{cursor:pointer}.serviceCheck{flex-shrink:0}.filelist{margin-top:10px}.photo-preview{width:55px;height:55px;border-radius:8px;object-fit:cover;border:1px solid #e0e0e0}.roomactions{display:flex;gap:8px;flex-wrap:wrap}.formatnote{padding:10px;border-radius:8px;background:#f6f3ea;font-size:12px;color:#675b47}.printbar{margin:12px 0}.upload-area{border:1px dashed #a7b6b9;border-radius:12px;padding:13px;background:#fafcfc}
</style></head><body><header><div class="wrap"><div class="brand"><span class="logo">P</span><span>POCKTIVO<div class="subbrand">Dein Büro. Immer dabei. · V4.3</div></span></div><button class="toplink" id="homeBtn">⌂ Startseite</button></div></header><main class="page" id="app"></main><script>
'use strict';const STORE='pocktivo-projects-v40';const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>globalThis.crypto?.randomUUID?.()||('id'+Date.now()+Math.random().toString(36).slice(2));let projects=[];try{projects=JSON.parse(localStorage.getItem(STORE)||'[]');if(!Array.isArray(projects))projects=[]}catch(e){projects=[]}let page='home',currentId=null,currentRoom=null,serviceData=[],ruleData=[];let loadErrors=[];let mediaDbPromise=null;let mediaRec=null;let mediaChunks=[];let activeStream=null;let planDraft=[];let planActive=false;
function mediaDB(){if(mediaDbPromise)return mediaDbPromise;mediaDbPromise=new Promise((resolve,reject)=>{if(!('indexedDB'in window))return reject(Error('Dieser Browser unterstützt keine lokale Dateiablage.'));const request=indexedDB.open('pocktivo-media-v43',1);request.onupgradeneeded=()=>request.result.createObjectStore('files');request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error)});return mediaDbPromise}
async function mediaPut(id,blob){const db=await mediaDB();return new Promise((resolve,reject)=>{const tx=db.transaction('files','readwrite');tx.objectStore('files').put(blob,id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
async function mediaGet(id){const db=await mediaDB();return new Promise((resolve,reject)=>{const tx=db.transaction('files','readonly');const req=tx.objectStore('files').get(id);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function mediaDelete(id){const db=await mediaDB();return new Promise((resolve,reject)=>{const tx=db.transaction('files','readwrite');tx.objectStore('files').delete(id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
function formatSize(n){return n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.ceil(n/1024))+' KB'}
function roomAttachments(r){return (r.attachments||[]).map(f=>`<div class="fileitem"><div class="fname"><b>${esc(f.name)}</b><div class="muted tiny">${esc(f.kind)} · ${formatSize(f.size||0)}</div></div><div class="btnrow"><button type="button" class="btn light sm" data-media="open" data-file="${f.id}">Öffnen</button><button type="button" class="btn danger sm" data-media="delete" data-file="${f.id}">×</button></div></div>`).join('')||'<p class="muted tiny">Noch keine Dateien aufgenommen.</p>'}
async function attachFiles(files,kind){const r=getRoom();if(!r||!files?.length)return;r.attachments??=[];let count=0;for(const f of files){if(f.size>20*1024*1024){alert('Diese Datei ist zu groß (max. 20 MB je Datei): '+f.name);continue}const id=uid();try{await mediaPut(id,f);r.attachments.push({id,name:f.name||kind,size:f.size,kind,mime:f.type||'application/octet-stream',at:new Date().toISOString()});count++}catch(e){alert('Lokales Speichern fehlgeschlagen: '+e.message);break}}if(count){save();render();}}
async function mediaAction(act,id){const r=getRoom(),f=r?.attachments?.find(x=>x.id===id);if(!f)return;if(act==='delete'){if(!confirm('Datei lokal löschen?'))return;await mediaDelete(id);r.attachments=r.attachments.filter(x=>x.id!==id);save();render();return}try{const blob=await mediaGet(id);if(!blob)throw Error('Datei nicht mehr im Browserspeicher.');const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.target='_blank';link.rel='noopener';if(!blob.type.startsWith('image/')&&!blob.type.startsWith('audio/'))link.download=f.name;document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}catch(e){alert(e.message)}}
function attachInput(id,kind){const el=document.getElementById(id);if(el)el.addEventListener('change',async e=>{const files=[...e.target.files];const form=$('#roomForm');if(form)updateRoom(form);await attachFiles(files,kind)})}
async function toggleAudio(){const btn=$('#recordAudio'),status=$('#audioStatus');if(!btn)return;if(mediaRec&&mediaRec.state==='recording'){mediaRec.stop();return}if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){status.textContent='Audioaufnahme wird von diesem Browser nicht unterstützt. Bitte über das iPhone-Diktiermikrofon Texte eingeben.';return}try{activeStream=await navigator.mediaDevices.getUserMedia({audio:true});const options=['audio/mp4','audio/webm;codecs=opus','audio/webm'].find(t=>MediaRecorder.isTypeSupported(t));mediaRec=new MediaRecorder(activeStream,options?{mimeType:options}:undefined);mediaChunks=[];mediaRec.ondataavailable=e=>{if(e.data.size)mediaChunks.push(e.data)};mediaRec.onstop=async()=>{const blob=new Blob(mediaChunks,{type:mediaRec.mimeType||'audio/mp4'}),ext=blob.type.includes('webm')?'webm':'m4a';activeStream?.getTracks().forEach(x=>x.stop());activeStream=null;mediaRec=null;btn.textContent='● Audio aufnehmen';btn.classList.remove('rec');status.textContent='Audio gespeichert. Hinweis: Es wird noch NICHT automatisch in Text umgewandelt.';const r=getRoom();const form=$('#roomForm');if(form)updateRoom(form);await attachFiles([new File([blob],'Diktat_'+new Date().toISOString().slice(0,19).replace(/:/g,'-')+'.'+ext,{type:blob.type})],'Audioaufnahme')};mediaRec.start();btn.textContent='■ Aufnahme beenden';btn.classList.add('rec');status.textContent='Aufnahme läuft – zum Beenden erneut tippen.'}catch(e){status.textContent='Mikrofonzugriff nicht möglich. Über die Tastatur diktieren oder unter HTTPS öffnen.'}}
function getPlan(r){return Array.isArray(r.floorplan)&&r.floorplan.length>=3?r.floorplan:[]}
function planMetrics(points,height){if(!points||points.length<3)return null;const vs=points.map(p=>({x:+p.x,y:+p.y}));let area=0,peri=0;for(let i=0;i<vs.length;i++){let a=vs[i],b=vs[(i+1)%vs.length];area+=a.x*b.y-b.x*a.y;peri+=Math.hypot(b.x-a.x,b.y-a.y)}return {area:Math.abs(area)/2,perimeter:peri,wall:peri*(+height||0)}}
function metrics(r){const plan=planMetrics(getPlan(r),r.height);return plan||{area:(+r.length||0)*(+r.width||0),perimeter:2*((+r.length||0)+(+r.width||0)),wall:2*((+r.length||0)+(+r.width||0))*(+r.height||0)}}
function planUI(r){return `<div class="panel" id="floorplanPanel"><div class="sectionhead"><h2 class="h2">Finger-Grundriss (Test)</h2><span class="pill">Freie Raumform</span></div><p class="section-hint">Tippe die Raumecken der Reihe nach in die Fläche. Für genaue Maße kalibrierst du anschließend die erste Wand. Die Form kann später noch geändert werden.</p><svg id="planSvg" class="drawpad" viewBox="0 0 330 260" aria-label="Grundriss zeichnen"></svg><div id="planPointText" class="floorhint"></div><div class="btnrow" style="margin-top:12px"><button type="button" class="btn light sm" id="undoPoint">↶ Letzten Punkt</button><button type="button" class="btn light sm" id="clearPlan">Zurücksetzen</button><button type="button" class="btn sm" id="savePlan">Grundriss übernehmen</button></div><div class="formatnote">Für die Demo wird die Zeichnung anhand einer bekannten Wandlänge skaliert. Nur rechteckige Räume können weiterhin direkt über Länge × Breite erfasst werden. Komplexe Aufmaße bitte nachmessen.</div></div>`}
function renderPlanSvg(){const svg=$('#planSvg'),info=$('#planPointText');if(!svg)return;const p=planDraft;const pts=p.map(x=>x.x+','+x.y).join(' ');svg.innerHTML=`<defs><pattern id="sq" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#e7eded" stroke-width="1"/></pattern></defs><rect width="330" height="260" fill="url(#sq)"/>${p.length>1?`<polyline points="${pts}" fill="none" stroke="#1e3341" stroke-width="3"/>`:''}${p.length>2?`<line x1="${p.at(-1).x}" y1="${p.at(-1).y}" x2="${p[0].x}" y2="${p[0].y}" stroke="#c08856" stroke-dasharray="6 5" stroke-width="2"/>`:''}${p.map((a,i)=>`<circle cx="${a.x}" cy="${a.y}" r="5" fill="#bd814d" stroke="white" stroke-width="2"/><text x="${a.x+8}" y="${a.y-7}" font-size="11" fill="#1e3341">${i+1}</text>`).join('')}`;if(info)info.textContent=p.length+' Eckpunkte. Mindestens 3 zum Speichern. Zeichnung auf Basis der ersten gemessenen Wand skalieren.'}
function setupPlan(){const r=getRoom(),svg=$('#planSvg');if(!svg||!r)return;const existing=getPlan(r);if(!planActive||!planDraft.length){planDraft=existing.length?existing.map(p=>({x:p.px??p.x,y:p.py??p.y})):[];planActive=true}renderPlanSvg();svg.addEventListener('pointerdown',e=>{const rect=svg.getBoundingClientRect();const x=Math.max(5,Math.min(325,(e.clientX-rect.left)/rect.width*330)),y=Math.max(5,Math.min(255,(e.clientY-rect.top)/rect.height*260));if(planDraft.length>=24)return alert('Maximal 24 Raumecken in dieser Demo.');planDraft.push({x,y});renderPlanSvg()});$('#undoPoint').onclick=()=>{planDraft.pop();renderPlanSvg()};$('#clearPlan').onclick=()=>{if(!confirm('Grundrisszeichnung zurücksetzen?'))return;planDraft=[];r.floorplan=[];save();renderPlanSvg();updateMetricsUI()};$('#savePlan').onclick=()=>{if(planDraft.length<3)return alert('Bitte mindestens 3 Eckpunkte anlegen.');const p=planDraft;const pix=Math.hypot(p[1].x-p[0].x,p[1].y-p[0].y);const length=prompt('Wie lang ist die erste gezeichnete Wand in Metern? (z. B. 3,20)',r.planRefLength||'3');if(length===null)return;const meters=Number(length.replace(',','.'));if(!Number.isFinite(meters)||meters<=0||pix<5)return alert('Bitte gültige Wandlänge und unterschiedliche Eckpunkte eingeben.');const unit=meters/pix,ox=p[0].x,oy=p[0].y;r.planRefLength=meters;r.floorplan=p.map(q=>({x:(q.x-ox)*unit,y:(q.y-oy)*unit,px:q.x,py:q.y}));const f=$('#roomForm');if(f)updateRoom(f);save();updateMetricsUI();$('#planPointText').textContent='Grundriss gespeichert und anhand der ersten Wand skaliert. Maße bitte vor Nutzung prüfen.';};}
function updateMetricsUI(){const r=getRoom();if(!r)return;const m=metrics(r);if($('#floorArea'))$('#floorArea').textContent=fmt(m.area);if($('#perimeter'))$('#perimeter').textContent=fmt(m.perimeter);if($('#wallArea'))$('#wallArea').textContent=fmt(m.wall)}

function save(){try{localStorage.setItem(STORE,JSON.stringify(projects));return true}catch(e){alert('Speichern nicht möglich (Speicher voll oder privater Browser). Bitte Daten exportieren.');return false}}function getProject(){return projects.find(x=>x.id===currentId)}function getRoom(){return getProject()?.rooms.find(x=>x.id===currentRoom)}function nav(p,id=null,rid=null){if(p!=='room'||(rid!==null&&rid!==currentRoom)){planActive=false;planDraft=[]}page=p;if(id!==null)currentId=id;if(rid!==null)currentRoom=rid;render();window.scrollTo(0,0)}function record(t){return `<div class="field"><label>${t[1]}</label><input name="${t[0]}" value="${esc(t[2]||'')}" ${t[3]||''}></div>`}function headline(label,title,description=''){return `<div class="eyebrow">${label}</div><div class="h1">${title}</div>${description?`<p class="muted">${description}</p>`:''}`};
function render(){const app=$('#app');if(page==='home')app.innerHTML=homeView();if(page==='create')app.innerHTML=projectForm();if(page==='project')app.innerHTML=projectView();if(page==='room')app.innerHTML=roomView();if(page==='services')app.innerHTML=servicesView();if(page==='documents')app.innerHTML=documentsView();bind();}
function homeView(){return headline('Meine Arbeitszentrale','Projekte','Alle Daten dieser Demo bleiben ausschließlich in diesem Browser gespeichert.')+`<div class="stats"><div class="stat"><b>${projects.length}</b><span>Projekte</span></div><div class="stat"><b>${projects.reduce((a,p)=>a+p.rooms.length,0)}</b><span>Räume</span></div><div class="stat"><b>${projects.filter(p=>p.status==='offen').length}</b><span>Offen</span></div></div><div class="panel"><div class="sectionhead"><h2 class="h2">Projektübersicht</h2><button class="btn" data-act="create">+ Neues Projekt</button></div>${projects.length?projects.map(p=>`<button class="proj" data-act="open" data-id="${p.id}"><span><strong>${esc(p.title||'Unbenanntes Projekt')}</strong><span class="muted tiny">${esc(p.customer.name||p.customer.company||'Kunde nicht angegeben')} · ${p.rooms.length} Räume · ${esc(p.status||'offen')}</span></span><span class="arrow">›</span></button>`).join(''):`<div class="empty">Noch keine Projekte angelegt.<br>Starte mit deinem ersten Testprojekt.</div>`}</div><div class="note">Nur fiktive Kundendaten verwenden. Diese Version hat noch keinen Login, keine Synchronisierung und keine Cloud-Sicherung.</div><div class="btnrow"><button class="btn light sm" data-act="export">Projekte sichern (JSON)</button><button class="btn light sm" data-act="import">Sicherung importieren</button><input type="file" id="importfile" accept="application/json,.json" hidden></div>`}

function proposalEngine(r){const text=(r.description||'').toLocaleLowerCase('de-DE'),out=[],seen=new Set();

function signDoc(id){const d=docDefs.find(x=>x.id===id);if(!d)return;const p=getProject();const modal=document.createElement('div');modal.id='sigmodal';modal.style='position:fixed;inset:0;background:#0009;z-index:100;display:flex;align-items:center;justify-content:center;padding:14px';modal.innerHTML=`<div class="panel" style="max-width:560px;width:100%;max-height:90vh;overflow:auto;margin:0"><h2 class="h2">Demo-Unterschrift: ${esc(d.name)}</h2><div class="note">Nur technische Funktionsdemo, keine rechtlich bestätigte elektronische Signatur. Inhalt zuerst unter „Ansehen / prüfen“ kontrollieren.</div><div class="field"><label>Name der unterzeichnenden Person</label><input id="signName" placeholder="Musterperson"></div><canvas id="sigcanvas" class="sigbox"></canvas><div class="btnrow" style="margin-top:12px"><button class="btn light" id="clearSig">Löschen</button><button class="btn" id="saveSig">Demo-Signatur speichern</button><button class="btn outline" id="closeSig">Abbrechen</button></div></div>`;document.body.append(modal);
 const canvas=modal.querySelector('canvas');const bounds=canvas.getBoundingClientRect(),scale=window.devicePixelRatio||1;canvas.width=Math.max(1,Math.round(bounds.width*scale));canvas.height=Math.round(140*scale);const ctx=canvas.getContext('2d');ctx.scale(scale,scale);ctx.strokeStyle='#182f3d';ctx.lineWidth=2.5;ctx.lineJoin='round';ctx.lineCap='round';let drawing=false,hasInk=false;function xy(e){const a=canvas.getBoundingClientRect();return [e.clientX-a.left,e.clientY-a.top]};canvas.addEventListener('pointerdown',e=>{drawing=true;canvas.setPointerCapture(e.pointerId);ctx.beginPath();const [x,y]=xy(e);ctx.moveTo(x,y)});canvas.addEventListener('pointermove',e=>{if(!drawing)return;const [x,y]=xy(e);ctx.lineTo(x,y);ctx.stroke();hasInk=true});canvas.addEventListener('pointerup',()=>drawing=false);canvas.addEventListener('pointercancel',()=>drawing=false);

function renderSelectedServices(selection){return selection.length?selection.map(x=>`<div class="service"><button class="btn danger sm" data-act="removeservice" data-id="${esc(x.id)}">×</button><div><b>${esc(x.name)}</b><div class="description">${esc(x.unit||'')} · ${esc(x.id)}</div></div></div>`).join(''):'<p class="muted">Noch nichts ausgewählt.</p>'}
function serviceLine(s,selection,kind='',why=''){const id=String(s.ID),found=selection.some(x=>x.id===id);return `<label class="service ${found?'selected':''}"><input class="serviceCheck" type="checkbox" data-id="${esc(id)}" ${found?'checked':''}><div><b>${esc(s.Leistung)}</b>${kind?`<div class="suggest-label">${esc(kind)}${why?' · '+esc(why):''}</div>`:''}<div class="description">${esc(s.Gewerk)} · ${esc(s.Einheit)} · ${esc(id)}</div></div></label>`}
function refreshSelection(){const r=getRoom();if(!r)return;const c=$('#selectedCount'),box=$('#selectedServices');if(c)c.textContent=r.selected.length;if(box){box.innerHTML=renderSelectedServices(r.selected);box.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click',()=>action(b.dataset.act,b.dataset.id)))}document.querySelectorAll('.serviceCheck').forEach(x=>{x.checked=r.selected.some(s=>s.id===x.dataset.id);x.closest('.service')?.classList.toggle('selected',x.checked)})}
function addService(id,checked){const r=getRoom(),s=serviceData.find(x=>x.ID===id);if(!r||!s)return;if(checked&&!r.selected.some(x=>x.id===id))r.selected.push({id,name:s.Leistung,unit:s.Einheit,trade:s.Gewerk});if(!checked)r.selected=r.selected.filter(x=>x.id!==id);save();refreshSelection()}
function renderSearch(value){const t=value.trim().toLocaleLowerCase('de-DE'),box=$('#searchResults');if(!box)return;box.innerHTML=t.length<2?'<p class="muted tiny">Mindestens zwei Zeichen eingeben.</p>':serviceData.filter(s=>(s.Gewerk+' '+s.Leistung+' '+s.Kategorie).toLocaleLowerCase('de-DE').includes(t)).slice(0,35).map(s=>serviceLine(s,getRoom().selected)).join('')||'<p class="muted">Keine Treffer.</p>';box.querySelectorAll('.serviceCheck').forEach(cb=>cb.addEventListener('change',e=>addService(e.target.dataset.id,e.target.checked)))}
let recognition=null;const expandedGroups=new Set();
function setupVoice(){const button=$('#voiceBtn'),status=$('#voiceStatus'),textarea=$('#roomDescription');if(!button)return;const Speech=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Speech){status.textContent='Spracherkennung hier nicht verfügbar. Nutze das Mikrofon der iPhone-Tastatur.';button.disabled=true;button.textContent='Textdiktat im Browser nicht verfügbar';return}
 button.onclick=()=>{if(recognition){recognition.stop();return}const rec=new Speech();recognition=rec;rec.lang='de-DE';rec.interimResults=false;rec.continuous=false;let base=textarea.value.trim();rec.onstart=()=>{button.textContent='■ Aufnahme stoppen';button.classList.add('active');status.textContent='Sprich jetzt. Bitte Mikrofon erlauben.'};rec.onresult=e=>{let text=Array.from(e.results).map(x=>x[0].transcript).join(' ').trim();textarea.value=(base?base+' ':'')+text;textarea.dispatchEvent(new Event('input',{bubbles:true}));status.textContent='Text übernommen. Bitte kurz prüfen.'};rec.onerror=e=>{status.textContent='Mikrofon nicht verfügbar ('+e.error+'). Du kannst über die Tastatur diktieren.'};rec.onend=()=>{recognition=null;button.textContent='🎙️ Diktieren';button.classList.remove('active')};try{rec.start()}catch(e){status.textContent='Aufnahme nicht gestartet. Nutze das Tastaturmikrofon.';recognition=null}}}
function bind(){document.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click',()=>action(b.dataset.act,b.dataset.id)));$('#newProject')?.addEventListener('submit',e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target).entries());let p={id:uid(),title:d.title,customer:d,rooms:[],status:'offen',created:Date.now()};projects.unshift(p);if(save())nav('project',p.id)});$('#differentSite')?.addEventListener('change',e=>$('#siteFields').hidden=!e.target.checked);$('#roomForm')?.addEventListener('submit',e=>{e.preventDefault();updateRoom(e.target);nav('room')});$('#roomForm')?.querySelectorAll('input[type=number]').forEach(el=>el.addEventListener('input',()=>{const f=$('#roomForm');const L=+f.elements.namedItem('length').value||0,W=+f.elements.namedItem('width').value||0,H=+f.elements.namedItem('height').value||0;const r=getRoom();const mm=getPlan(r).length?metrics({...r,height:H}):{area:L*W,perimeter:2*(L+W),wall:2*(L+W)*H};$('#floorArea').textContent=fmt(mm.area);$('#perimeter').textContent=fmt(mm.perimeter);$('#wallArea').textContent=fmt(mm.wall)}));setupVoice();setupPlan();$('#recordAudio')?.addEventListener('click',toggleAudio);$('#cameraBtn')?.addEventListener('click',()=>$('#cameraFile')?.click());$('#galleryBtn')?.addEventListener('click',()=>$('#galleryFile')?.click());$('#documentBtn')?.addEventListener('click',()=>$('#documentFile')?.click());attachInput('cameraFile','Foto');attachInput('galleryFile','Foto');attachInput('documentFile','Dokument');document.querySelectorAll('[data-media]').forEach(b=>b.addEventListener('click',()=>mediaAction(b.dataset.media,b.dataset.file)));document.querySelectorAll('details[data-group]').forEach(d=>{d.addEventListener('toggle',()=>{const key=d.dataset.group;if(d.open)expandedGroups.add(key);else expandedGroups.delete(key)})});document.querySelectorAll('.serviceCheck').forEach(cb=>cb.addEventListener('change',e=>addService(e.target.dataset.id,e.target.checked)));$('#serviceSearch')?.addEventListener('input',e=>renderSearch(e.target.value));$('#importfile')?.addEventListener('change',importProjects)}
function updateRoom(f){const r=getRoom(),d=Object.fromEntries(new FormData(f).entries());r.name=d.roomName.trim()||r.name;r.length=+d.length||0;r.width=+d.width||0;r.height=+d.height||0;r.description=d.description||'';save()}
function action(a,id){const p=getProject();if(a==='home')nav('home');if(a==='create')nav('create');if(a==='open')nav('project',id);if(a==='project')nav('project');if(a==='documents')nav('documents');if(a==='docview')showDoc(id);if(a==='docsign')signDoc(id);if(a==='finishsurvey'){p.surveyCompleted=new Date().toISOString();save();render();}if(a==='room'){if($('#roomForm'))updateRoom($('#roomForm'));nav('room')}if(a==='newroom'){const name=prompt('Wie heißt der neue Raum?',`Raum ${(p?.rooms.length||0)+1}`);if(!name?.trim())return;const r={id:uid(),name:name.trim(),length:0,width:0,height:0,description:'',selected:[]};p.rooms.push(r);save();nav('room',null,r.id)}if(a==='openroom')nav('room',null,id);if(a==='services'){if($('#roomForm'))updateRoom($('#roomForm'));nav('services')}if(a==='status'){p.status=p.status==='offen'?'abgeschlossen':'offen';save();render()}if(a==='deleteroom'&&confirm('Diesen Raum samt Aufmaß und Leistungen wirklich löschen?')){p.rooms=p.rooms.filter(r=>r.id!==currentRoom);save();nav('project')}if(a==='deleteproject'&&confirm('Projekt einschließlich aller Räume endgültig löschen?')){projects=projects.filter(x=>x.id!==currentId);save();nav('home')}if(a==='removeservice'){getRoom().selected=getRoom().selected.filter(x=>x.id!==id);save();refreshSelection()}if(a==='custom'){const s=$('#customService')?.value.trim();if(!s)return;getRoom().selected.push({id:'MAN-'+uid(),name:s,unit:'offen',trade:'Manuelle Ergänzung'});save();$('#customService').value='';refreshSelection()}if(a==='export'){const data=page==='project'&&p?[p]:projects;const blob=new Blob([JSON.stringify({version:4,projects:data},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download='pocktivo_sicherung.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}if(a==='import')$('#importfile')?.click();if(a==='editproject'){const title=prompt('Projektbezeichnung bearbeiten',p.title);if(title?.trim()){p.title=title.trim();save();render()}}}
async function importProjects(e){const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text()),arr=d.projects;if(!Array.isArray(arr)||!arr.every(p=>p.id&&Array.isArray(p.rooms)&&p.customer))throw Error('Ungültige Projektdatei');if(!confirm(`${arr.length} Projekte importieren? Gleichnamige IDs werden ersetzt.`))return;const m=new Map(projects.map(x=>[x.id,x]));arr.forEach(x=>m.set(x.id,x));projects=[...m.values()];save();render()}catch(e){alert('Import fehlgeschlagen: '+e.message)}}
$('#homeBtn').onclick=()=>nav('home');Promise.allSettled([fetch('./leistungen.json').then(r=>{if(!r.ok)throw Error('leistungen.json: '+r.status);return r.json()}),fetch('./ablauf.json').then(r=>{if(!r.ok)throw Error('ablauf.json: '+r.status);return r.json()})]).then(([a,b])=>{if(a.status==='fulfilled')serviceData=a.value;else loadErrors.push(a.reason.message);if(b.status==='fulfilled')ruleData=b.value.rules||[];else loadErrors.push(b.reason.message);if(page==='services')render()});render();
</script></body></html>
